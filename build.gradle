plugins {
	id 'java'
	id 'org.springframework.boot' version '3.1.4'
	id 'io.spring.dependency-management' version '1.1.3'
}

group = 'com.saas.tourismagency.admin.backoffice'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '21'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
	all {
		exclude group: 'commons-logging', module: 'commons-logging'
	}
}

ext {
	jsonwebtoken = '0.11.5'
	poi = '5.2.5'
	jasperReport = '6.21.0'
}

repositories {
	mavenCentral()
	maven {
		url "https://jaspersoft.jfrog.io/jaspersoft/jaspersoft-repo"
	}
}

dependencies {

	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	implementation 'javax.validation:validation-api:2.0.1.Final'
	implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'
	implementation group: 'org.springdoc', name: 'springdoc-openapi-starter-webmvc-ui', version: '2.0.3'
	implementation "io.jsonwebtoken:jjwt-api:$jsonwebtoken"
	implementation "org.apache.poi:poi:$poi"
	implementation "org.apache.poi:poi-ooxml:$poi"
	implementation 'org.apache.tomcat.embed:tomcat-embed-el:10.1.13'
	implementation "net.sf.jasperreports:jasperreports:${jasperReport}"
	implementation "net.sf.jasperreports:jasperreports-fonts:${jasperReport}"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:$jsonwebtoken"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:$jsonwebtoken"
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'

}

tasks.named('test') {
	useJUnitPlatform()
}
